name: travel_india
description: "Explore beautiful places across India - Temples, Beaches, Hill Stations & more"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  google_fonts: ^6.2.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
